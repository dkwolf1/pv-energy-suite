title: Phase Guard
path: phase-guard
icon: mdi:chart-timeline-variant
type: sections
subview: true
max_columns: 3
dense_section_placement: false
header:
  layout: responsive
  badges_position: bottom
  badges_wrap: scroll
badges:
  - type: entity
    entity: sensor.phase_guard_status
    name: Status
    icon: mdi:shield-home
    show_state: true
    show_icon: true
    show_name: true
    color: state
  - type: entity
    entity: sensor.phase_guard_peak_phase_current
    name: Piekfase
    icon: mdi:current-ac
    show_state: true
    show_icon: true
    show_name: true
    color: state
  - type: entity
    entity: sensor.phase_guard_lowest_headroom
    name: Laagste ruimte
    icon: mdi:gauge-low
    show_state: true
    show_icon: true
    show_name: true
    color: state
  - type: entity
    entity: binary_sensor.phase_guard_data_valid
    name: Meetdata
    icon: mdi:database-check
    show_state: true
    show_icon: true
    show_name: true
    color: state
sections:
  - type: grid
    cards:
      - type: heading
        heading: Status
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.phase_guard_data_valid
            state: 'off'
        card:
          type: tile
          entity: binary_sensor.phase_guard_data_valid
          name: Meetgegevens onbetrouwbaar
          icon: mdi:database-alert
          color: red
          vertical: false
        grid_options:
          columns: full
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.phase_guard_overload
            state: 'on'
        card:
          type: tile
          entity: binary_sensor.phase_guard_overload
          name: Overbelasting gedetecteerd
          icon: mdi:flash-alert
          color: red
          vertical: false
        grid_options:
          columns: full
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.phase_guard_critical
            state: 'on'
          - condition: state
            entity: binary_sensor.phase_guard_overload
            state: 'off'
        card:
          type: tile
          entity: binary_sensor.phase_guard_critical
          name: Kritieke fasebelasting
          icon: mdi:alert-octagon
          color: red
          vertical: false
        grid_options:
          columns: full
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_status
            name: Actuele status
            icon: mdi:shield-home
          - entity: sensor.phase_guard_reason
            name: Uitleg
            icon: mdi:text-box-outline
          - entity: sensor.phase_guard_recommended_action
            name: Aanbevolen actie
            icon: mdi:lightbulb-alert
          - entity: sensor.phase_guard_last_update
            name: Laatste update
            icon: mdi:clock-check
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Capaciteit
      - type: gauge
        entity: sensor.phase_guard_peak_phase_current
        name: Hoogste fasestroom
        min: 0
        max: 30
        needle: true
        severity:
          green: 0
          yellow: 17.5
          red: 22.5
        grid_options:
          columns: full
          rows: 3
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_most_loaded_phase
            name: Zwaarste fase
            icon: mdi:arrow-up-bold-circle
          - entity: sensor.phase_guard_lowest_headroom
            name: Laagste resterende ruimte
            icon: mdi:gauge-low
          - entity: sensor.phase_guard_total_current
            name: Som fasestromen
            icon: mdi:sigma
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Verdeling
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_most_loaded_phase
            name: Zwaarst belast
            icon: mdi:arrow-up-bold-circle
          - entity: sensor.phase_guard_least_loaded_phase
            name: Lichtst belast
            icon: mdi:arrow-down-bold-circle
          - entity: sensor.phase_guard_phase_imbalance_amp
            name: Faseverschil
            icon: mdi:scale-unbalanced
          - entity: sensor.phase_guard_phase_imbalance_percent
            name: Onbalans
            icon: mdi:percent
          - entity: sensor.phase_guard_current_source
            name: Stroombron
            icon: mdi:source-branch
          - entity: binary_sensor.phase_guard_data_valid
            name: Meetgegevens geldig
            icon: mdi:database-check
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Fase L1
      - type: gauge
        entity: sensor.phase_guard_l1_current
        name: L1 stroom
        min: 0
        max: 30
        needle: true
        severity:
          green: 0
          yellow: 17.5
          red: 22.5
        grid_options:
          columns: full
          rows: 3
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l1_level
            name: Belastingsniveau
            icon: mdi:gauge
          - entity: sensor.phase_guard_l1_headroom
            name: Resterende ruimte
            icon: mdi:gauge-low
          - entity: sensor.phase_guard_l1_predicted_60s
            name: Voorspeld over 60 seconden
            icon: mdi:chart-timeline-variant-shimmer
          - entity: sensor.phase_guard_l1_fuse_stress
            name: Heuristische zekeringbelasting
            icon: mdi:thermometer-alert
          - entity: sensor.phase_guard_l1_direction
            name: Energierichting
            icon: mdi:swap-horizontal
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Fase L2
      - type: gauge
        entity: sensor.phase_guard_l2_current
        name: L2 stroom
        min: 0
        max: 30
        needle: true
        severity:
          green: 0
          yellow: 17.5
          red: 22.5
        grid_options:
          columns: full
          rows: 3
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l2_level
            name: Belastingsniveau
            icon: mdi:gauge
          - entity: sensor.phase_guard_l2_headroom
            name: Resterende ruimte
            icon: mdi:gauge-low
          - entity: sensor.phase_guard_l2_predicted_60s
            name: Voorspeld over 60 seconden
            icon: mdi:chart-timeline-variant-shimmer
          - entity: sensor.phase_guard_l2_fuse_stress
            name: Heuristische zekeringbelasting
            icon: mdi:thermometer-alert
          - entity: sensor.phase_guard_l2_direction
            name: Energierichting
            icon: mdi:swap-horizontal
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Fase L3
      - type: gauge
        entity: sensor.phase_guard_l3_current
        name: L3 stroom
        min: 0
        max: 30
        needle: true
        severity:
          green: 0
          yellow: 17.5
          red: 22.5
        grid_options:
          columns: full
          rows: 3
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l3_level
            name: Belastingsniveau
            icon: mdi:gauge
          - entity: sensor.phase_guard_l3_headroom
            name: Resterende ruimte
            icon: mdi:gauge-low
          - entity: sensor.phase_guard_l3_predicted_60s
            name: Voorspeld over 60 seconden
            icon: mdi:chart-timeline-variant-shimmer
          - entity: sensor.phase_guard_l3_fuse_stress
            name: Heuristische zekeringbelasting
            icon: mdi:thermometer-alert
          - entity: sensor.phase_guard_l3_direction
            name: Energierichting
            icon: mdi:swap-horizontal
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Fasestroom — 24 uur
      - type: history-graph
        hours_to_show: 24
        entities:
          - entity: sensor.phase_guard_l1_current
            name: L1
          - entity: sensor.phase_guard_l2_current
            name: L2
          - entity: sensor.phase_guard_l3_current
            name: L3
        grid_options:
          columns: full
          rows: 4
  - type: grid
    cards:
      - type: heading
        heading: Zekeringbelasting — 24 uur
      - type: history-graph
        hours_to_show: 24
        entities:
          - entity: sensor.phase_guard_l1_fuse_stress
            name: L1
          - entity: sensor.phase_guard_l2_fuse_stress
            name: L2
          - entity: sensor.phase_guard_l3_fuse_stress
            name: L3
        grid_options:
          columns: full
          rows: 4
  - type: grid
    cards:
      - type: heading
        heading: Structurele balans
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_structural_imbalance
            name: Beoordeling
            icon: mdi:scale-balance
          - entity: sensor.phase_guard_structural_imbalance_amp
            name: Verschil
            icon: mdi:scale-unbalanced
          - entity: sensor.phase_guard_historically_most_loaded_phase
            name: Historisch zwaarste fase
            icon: mdi:arrow-up-bold-circle
          - entity: sensor.phase_guard_historically_least_loaded_phase
            name: Historisch lichtste fase
            icon: mdi:arrow-down-bold-circle
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Historie L1
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l1_p95_7d
            name: P95 — 7 dagen
            icon: mdi:chart-bell-curve
          - entity: sensor.phase_guard_l1_p95_30d
            name: P95 — 30 dagen
            icon: mdi:chart-bell-curve-cumulative
          - entity: sensor.phase_guard_l1_mean_7d
            name: Gemiddelde — 7 dagen
            icon: mdi:chart-line
          - entity: sensor.phase_guard_l1_max_30d
            name: Maximum — 30 dagen
            icon: mdi:chart-line-variant
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Historie L2
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l2_p95_7d
            name: P95 — 7 dagen
            icon: mdi:chart-bell-curve
          - entity: sensor.phase_guard_l2_p95_30d
            name: P95 — 30 dagen
            icon: mdi:chart-bell-curve-cumulative
          - entity: sensor.phase_guard_l2_mean_7d
            name: Gemiddelde — 7 dagen
            icon: mdi:chart-line
          - entity: sensor.phase_guard_l2_max_30d
            name: Maximum — 30 dagen
            icon: mdi:chart-line-variant
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Historie L3
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l3_p95_7d
            name: P95 — 7 dagen
            icon: mdi:chart-bell-curve
          - entity: sensor.phase_guard_l3_p95_30d
            name: P95 — 30 dagen
            icon: mdi:chart-bell-curve-cumulative
          - entity: sensor.phase_guard_l3_mean_7d
            name: Gemiddelde — 7 dagen
            icon: mdi:chart-line
          - entity: sensor.phase_guard_l3_max_30d
            name: Maximum — 30 dagen
            icon: mdi:chart-line-variant
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Grensduur L1
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l1_high_duration
            name: Boven 20 A
            icon: mdi:timer-alert
          - entity: sensor.phase_guard_l1_critical_duration
            name: Boven 22,5 A
            icon: mdi:timer-alert-outline
          - entity: sensor.phase_guard_l1_limit_duration
            name: Boven 25 A
            icon: mdi:flash-alert
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Grensduur L2
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l2_high_duration
            name: Boven 20 A
            icon: mdi:timer-alert
          - entity: sensor.phase_guard_l2_critical_duration
            name: Boven 22,5 A
            icon: mdi:timer-alert-outline
          - entity: sensor.phase_guard_l2_limit_duration
            name: Boven 25 A
            icon: mdi:flash-alert
        grid_options:
          columns: full
  - type: grid
    cards:
      - type: heading
        heading: Grensduur L3
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.phase_guard_l3_high_duration
            name: Boven 20 A
            icon: mdi:timer-alert
          - entity: sensor.phase_guard_l3_critical_duration
            name: Boven 22,5 A
            icon: mdi:timer-alert-outline
          - entity: sensor.phase_guard_l3_limit_duration
            name: Boven 25 A
            icon: mdi:flash-alert
        grid_options:
          columns: full
cards: []
